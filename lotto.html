<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 추첨</title>
    <style>
        @font-face {
            font-family: Cute;
            src: url('./Hakgyoansim\ Dunggeunmiso\ TTF\ B.ttf') format('truetype');
        }

        .clover{
            font-family: 'Cute', sans-serif;
            width: 500px;
            display: flex;
            justify-content: center;
        }
    </style>





    <script>
        function getLotto(){
            //랜덤
            // Math.ramdom() * 큰수를 곱해서 %45 +1
            let a = [];
            for(let i=0; i<6; i++){
                let b = Math.floor(Math.random()* 45)+1;
                while(a.includes(b)){
                    b = Math.floor(Math.random()*45)+1;
                }
                a.push(b);
                
            }
            //로직
            document.getElementById('lottoNumber').innerHTML = a;           
        }
    </script>
</head>
<body>
    <div class="clover"></div>
    <h1>🍀🍀오늘의 로또 번호 추첨🍀🍀</h1>

    <div class="set">
        <input onclick="getLotto()" type="button" value="🎲추첨하기" />
        <h2 id="lottoNumber"></h2>
    </div>
</body>
</html>
